server {
    listen 80;
    server_name blog.cafearoma.test;
    
    # Mismo volumen y misma ruta que en el contenedor "wordpress"
    root /var/www/html;
    index index.php;

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass wordpress:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
}